services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-AirBNB}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in Komodo environment}
      APP_URL: ${APP_URL:?set APP_URL in Komodo environment}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/data/database.sqlite
    volumes:
      - db:/app/data
      - uploads:/app/storage/app/public

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in Komodo environment}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  uploads:
  caddy_data:
  caddy_config:
